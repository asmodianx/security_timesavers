<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Detection Rule Workbench</title>
  <style>
    :root { color-scheme: dark; --bg:#09111e; --panel:#111d2e; --panel2:#182840; --line:#30445f; --text:#edf4ff; --muted:#a6b6cc; --accent:#62c8f5; --good:#62d39a; --warn:#f5c45e; --error:#ff7c88; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
    button,input,select,textarea,.fileButton { font:inherit; }
    button,.fileButton { color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 11px; cursor:pointer; }
    .primary { background:#126d92; }
    .app { min-height:100vh; display:grid; grid-template-rows:auto 1fr; }
    .top { display:flex; gap:9px; align-items:center; flex-wrap:wrap; padding:11px 15px; border-bottom:1px solid var(--line); background:#0d1828; }
    .top h1 { font-size:17px; margin:0 auto 0 0; }
    .badge { font-size:12px; color:#c9efff; background:#173b55; border-radius:99px; padding:3px 8px; }
    .status { color:var(--muted); }
    .layout { display:grid; grid-template-columns:245px minmax(0,1fr); min-height:0; }
    .side { padding:12px; border-right:1px solid var(--line); background:#0d1828; overflow:auto; }
    .sideHead { display:flex; justify-content:space-between; align-items:center; }
    .list { display:grid; gap:7px; margin-top:10px; }
    .ruleItem { text-align:left; }
    .ruleItem.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
    .ruleItem small { display:block; color:var(--muted); }
    .main { min-width:0; }
    .tabs { display:flex; gap:6px; padding:10px 12px 0; }
    .tab[aria-selected="true"] { border-color:var(--accent); }
    .view { display:none; padding:12px; }
    .view.active { display:block; }
    .editorGrid { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:12px; height:calc(100vh - 123px); }
    .testGrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .cardHead { display:flex; gap:8px; align-items:center; padding:9px 11px; border-bottom:1px solid var(--line); }
    .cardHead h2 { font-size:14px; margin:0 auto 0 0; }
    .editor,.sample { display:block; width:100%; border:0; outline:0; resize:none; padding:14px; background:#0b1524; color:var(--text); font:13px/1.55 ui-monospace,Consolas,monospace; tab-size:2; }
    .editor { height:calc(100% - 43px); }
    .sample { min-height:360px; }
    .issues,.results { padding:10px; overflow:auto; min-height:300px; }
    .issue,.match { padding:9px 10px; margin-bottom:8px; border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:7px; }
    .issue.error { border-left-color:var(--error); }
    .issue.ok,.match.good { border-color:var(--good); }
    small,.muted { color:var(--muted); }
    .tools { display:flex; gap:8px; margin-bottom:10px; }
    .tools input { flex:1; padding:9px; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--text); }
    .referenceGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px; }
    .referenceCard { padding:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
    .referenceCard h3 { margin:0 0 6px; font-size:14px; color:#cceeff; }
    .referenceCard code { color:#ffd686; white-space:pre-wrap; }
    input[type="file"] { display:none; }
    @media (max-width:900px) { .layout{grid-template-columns:1fr}.side{max-height:180px;border-right:0;border-bottom:1px solid var(--line)}.editorGrid,.testGrid{grid-template-columns:1fr;height:auto}.card{min-height:360px} }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Detection Rule Workbench <span class="badge">Offline</span></h1>
    <button id="newButton">New</button>
    <button id="duplicateButton">Duplicate</button>
    <label class="fileButton" for="fileInput">Import</label>
    <input id="fileInput" type="file" accept=".yar,.yara,.yaral,.yml,.yaml,.json,.txt,text/plain,application/json" multiple>
    <button id="exportButton">Export rule</button>
    <button id="exportGroupButton">Export group</button>
    <span id="status" class="status" role="status">Ready</span>
  </header>
  <div class="layout">
    <aside class="side">
      <div class="sideHead"><strong>Rule group</strong><button id="deleteButton">Delete</button></div>
      <div id="ruleList" class="list"></div>
    </aside>
    <main class="main">
      <nav class="tabs">
        <button class="tab" data-view="editorView" aria-selected="true">Editor</button>
        <button class="tab" data-view="testView" aria-selected="false">Sample test</button>
        <button class="tab" data-view="referenceView" aria-selected="false">Reference</button>
      </nav>
      <section id="editorView" class="view active">
        <div class="editorGrid">
          <div class="card">
            <div class="cardHead"><h2>Rule source</h2><select id="language"><option value="yara">YARA</option><option value="yaral">YARA-L 2.0</option><option value="sigma">Sigma</option></select><button id="formatButton">Format</button></div>
            <textarea id="editor" class="editor" spellcheck="false"></textarea>
          </div>
          <div class="card">
            <div class="cardHead"><h2>Validation and suggestions</h2><button id="validateButton">Validate</button></div>
            <div id="issues" class="issues" aria-live="polite"></div>
          </div>
        </div>
      </section>
      <section id="testView" class="view">
        <div class="testGrid">
          <div class="card"><div class="cardHead"><h2>Sample data</h2><button id="clearButton">Clear</button></div><textarea id="sample" class="sample" spellcheck="false" placeholder="Paste text or a JSON event/array."></textarea></div>
          <div class="card"><div class="cardHead"><h2>Local test results</h2><button id="runButton" class="primary">Run test</button></div><div id="results" class="results"><p class="muted">Tests run entirely in this browser.</p></div></div>
        </div>
      </section>
      <section id="referenceView" class="view">
        <div class="tools"><input id="referenceSearch" type="search" placeholder="Search sections, functions, fields, or examples"><select id="referenceLanguage"><option value="all">All</option><option value="yara">YARA</option><option value="yaral">YARA-L</option><option value="sigma">Sigma</option></select></div>
        <div id="referenceGrid" class="referenceGrid"></div>
      </section>
    </main>
  </div>
</div>
<script>
'use strict';
(function () {
  var MAX_FILE_SIZE = 2 * 1024 * 1024;
  var MAX_RULES = 200;

  function byId(id) { return document.getElementById(id); }
  function makeId() { return String(Date.now()) + '-' + String(Math.floor(Math.random() * 1000000000)); }
  function setStatus(message) { byId('status').textContent = message; }

  var templates = {
    yara: [
      'rule Example_Text_Match {',
      '  meta:',
      '    author = "analyst"',
      '    description = "Matches a sample marker"',
      '  strings:',
      '    $marker = "sample-marker" ascii nocase',
      '  condition:',
      '    $marker',
      '}'
    ].join('\n'),
    yaral: [
      'rule example_blocked_login_by_user {',
      '  meta:',
      '    author = "analyst"',
      '    description = "Counts blocked logins by user"',
      '    severity = "MEDIUM"',
      '    yara_version = "YL2.0"',
      '    rule_version = "1.0"',
      '  events:',
      '    $e.metadata.event_type = "USER_LOGIN"',
      '    $e.security_result.action = "BLOCK"',
      '    $user = $e.target.user.userid',
      '    $user != ""',
      '  match:',
      '    $user over 10m',
      '  outcome:',
      '    $risk_score = max(50)',
      '    $blocked_login_count = count($e.metadata.id)',
      '  condition:',
      '    #e >= 3',
      '  options:',
      '    allow_zero_values = false',
      '}'
    ].join('\n'),
    sigma: [
      'title: Suspicious PowerShell Encoded Command',
      'id: 00000000-0000-4000-8000-000000000001',
      'status: experimental',
      'description: Detects PowerShell execution with an encoded command argument',
      'author: analyst',
      'date: 2026-08-19',
      'tags:',
      '    - attack.execution',
      '    - attack.t1059.001',
      'logsource:',
      '    category: process_creation',
      '    product: windows',
      'detection:',
      '    selection_image:',
      "        Image|endswith: '\\\\powershell.exe'",
      '    selection_command:',
      '        CommandLine|contains:',
      "            - ' -enc '",
      "            - ' -encodedcommand '",
      '    condition: selection_image and selection_command',
      'falsepositives:',
      '    - Authorized administrative automation',
      'level: medium'
    ].join('\n')
  };

  var references = [
    ['yara','Rule structure','rule Name : tag { meta: strings: condition: }','The condition section is required.'],
    ['yara','Text strings','$a = "text" ascii wide nocase fullword','Text strings support common modifiers.'],
    ['yara','Hex strings','$h = { 4D 5A ?? [4-8] 50 45 }','Hex patterns support bytes, wildcards, jumps, and alternatives.'],
    ['yara','Regular expressions','$r = /powershell\\s+-enc/i','Use bounded expressions when possible.'],
    ['yara','Sets and occurrences','any of them; 2 of ($prefix*); #a; @a[1]; !a[1]','Quantify sets and inspect occurrences.'],
    ['yara','Modules','import "pe"; pe.is_pe','Module availability depends on the target engine.'],
    ['yaral','Complete section order','meta -> events -> match -> outcome -> condition -> options','Meta, events, and condition are required for rules; the others are conditional or optional.'],
    ['yaral','meta','meta: author = "team"','Stores descriptive rule metadata.'],
    ['yaral','events','$e.metadata.event_type = "USER_LOGIN"','Declares event variables, UDM filters, joins, and placeholders.'],
    ['yaral','match','match: $user over 10m','Groups events by placeholders and time.'],
    ['yaral','outcome','outcome: $risk_score = max(50)','Produces values for detections.'],
    ['yaral','condition','condition: #e >= 3','Defines detection logic.'],
    ['yaral','options','options: allow_zero_values = false','Controls supported evaluation behavior and belongs last.'],
    ['yaral','Functions','re.regex(); count(); count_distinct(); max(); min(); sum()','Common matching and aggregation functions.'],
    ['sigma','Complete structure','title; id; status; description; author; date; tags; logsource; detection; falsepositives; level','Title, logsource, and detection are core fields.'],
    ['sigma','Log source','logsource: category; product; service','Identifies the relevant source of events.'],
    ['sigma','Detection','detection: selection: Field|modifier: value; condition: selection','Selections define matching data and condition combines them.'],
    ['sigma','Value modifiers','contains; startswith; endswith; re; cidr; base64; all','Modifiers qualify matching behavior.'],
    ['sigma','Conditions','selection and not filter; 1 of selection_*; all of them','Conditions combine named selections.'],
    ['sigma','Interoperability','UTF-8; LF; lowercase keys; four-space indentation; .yml','These conventions improve portability.']
  ];

  var rules = [{ id:makeId(), language:'yara', name:'Example_Text_Match', source:templates.yara }];
  var activeId = rules[0].id;
  var validationTimer = null;

  function currentRule() {
    for (var i = 0; i < rules.length; i += 1) if (rules[i].id === activeId) return rules[i];
    return null;
  }

  function ruleName(source, language) {
    var match;
    if (language === 'sigma') {
      match = source.match(/^title:\s*(.+)$/m);
      return match ? match[1].trim() : 'untitled_sigma';
    }
    match = source.match(/\brule\s+([A-Za-z_]\w*)/);
    return match ? match[1] : 'untitled_rule';
  }

  function saveEditor() {
    var rule = currentRule();
    if (!rule) return;
    rule.source = byId('editor').value;
    rule.language = byId('language').value;
    rule.name = ruleName(rule.source, rule.language);
    renderRuleList();
  }

  function loadRule() {
    var rule = currentRule();
    if (!rule) return;
    byId('editor').value = rule.source;
    byId('language').value = rule.language;
    renderRuleList();
    validateRule();
  }

  function renderRuleList() {
    var list = byId('ruleList');
    list.replaceChildren();
    rules.forEach(function (rule) {
      var button = document.createElement('button');
      var title = document.createElement('strong');
      var detail = document.createElement('small');
      button.className = 'ruleItem' + (rule.id === activeId ? ' active' : '');
      button.setAttribute('data-rule-id', rule.id);
      title.textContent = rule.name;
      detail.textContent = rule.language === 'yaral' ? 'YARA-L 2.0' : rule.language.toUpperCase();
      button.append(title, detail);
      list.append(button);
    });
  }

  function addRule(language, source) {
    if (rules.length >= MAX_RULES) { setStatus('Rule limit reached'); return; }
    var newRule = { id:makeId(), language:language, source:source || templates[language] };
    newRule.name = ruleName(newRule.source, language);
    rules.push(newRule);
    activeId = newRule.id;
    loadRule();
  }

  function addIssue(collection, type, title, detail) {
    collection.push({ type:type, title:title, detail:detail });
  }

  function stripComments(source) {
    return source.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\r\n]*/g, '');
  }

  function braceBalance(source) {
    var clean = stripComments(source), count = 0, quoted = false, escaped = false;
    for (var i = 0; i < clean.length; i += 1) {
      var character = clean.charAt(i);
      if (quoted) {
        if (character === '"' && !escaped) quoted = false;
        escaped = character === '\\' && !escaped;
      } else if (character === '"') quoted = true;
      else if (character === '{') count += 1;
      else if (character === '}') count -= 1;
    }
    return count;
  }

  function validateRule() {
    saveEditor();
    var rule = currentRule(), source = rule.source, clean = stripComments(source), issues = [], match, keys, level;
    if (source.length > 500000) addIssue(issues, 'error', 'Rule is too large', 'Keep editor content below 500 KB.');

    if (rule.language === 'yara') {
      if (!/\brule\s+[A-Za-z_]\w*[^\{]*\{/.test(clean)) addIssue(issues, 'error', 'Missing rule declaration', 'Expected rule Rule_Name { ... }.');
      if (braceBalance(source) !== 0) addIssue(issues, 'error', 'Unbalanced braces', 'Add or remove a rule brace.');
      if (!/\bcondition\s*:/.test(clean)) addIssue(issues, 'error', 'Missing condition', 'Every YARA rule requires condition:.');
    } else if (rule.language === 'yaral') {
      if (!/\brule\s+[A-Za-z_]\w*\s*\{/.test(clean)) addIssue(issues, 'error', 'Missing rule declaration', 'Expected rule Rule_Name { ... }.');
      if (braceBalance(source) !== 0) addIssue(issues, 'error', 'Unbalanced braces', 'Add or remove a rule brace.');
      ['meta','events','condition'].forEach(function (section) {
        var sectionPattern = new RegExp('\\b' + section + '\\s*:');
        if (!sectionPattern.test(clean)) addIssue(issues, 'error', 'Missing ' + section + ' section', section + ' is required in a YARA-L rule.');
      });
      var sectionOrder = ['meta','events','match','outcome','condition','options'];
      var lastPosition = -1;
      sectionOrder.forEach(function (section) {
        var position = clean.search(new RegExp('\\b' + section + '\\s*:'));
        if (position >= 0 && position < lastPosition) addIssue(issues, 'warn', 'Section order issue', section + ' is out of order.');
        if (position >= 0) lastPosition = position;
      });
      if (/\bmatch\s*:/.test(clean) && !/\bover\s+\d+\s*[smhd]\b/.test(clean)) addIssue(issues, 'warn', 'Match window not recognized', 'Use a window such as $user over 10m.');
    } else {
      keys = [];
      source.split('\n').forEach(function (line) {
        match = line.match(/^([a-z][a-z0-9_-]*):(?:\s|$)/);
        if (match) keys.push(match[1]);
      });
      ['title','logsource','detection'].forEach(function (key) {
        if (keys.indexOf(key) < 0) addIssue(issues, 'error', 'Missing ' + key, 'Sigma rules require a top-level ' + key + ' field.');
      });
      if (source.indexOf('\t') >= 0) addIssue(issues, 'error', 'Tab indentation found', 'YAML indentation must use spaces.');
      if (!/^\s{4}condition:\s*\S+/m.test(source)) addIssue(issues, 'error', 'Missing detection condition', 'Add condition under detection.');
      match = source.match(/^level:\s*(\S+)/m);
      level = match ? match[1] : '';
      if (level && ['informational','low','medium','high','critical'].indexOf(level) < 0) addIssue(issues, 'warn', 'Unknown level', 'Use informational, low, medium, high, or critical.');
      if (!/^falsepositives:/m.test(source)) addIssue(issues, 'warn', 'No false positives documented', 'Document known benign causes when possible.');
    }

    var issueBox = byId('issues');
    issueBox.replaceChildren();
    if (issues.length === 0) addIssue(issues, 'ok', 'No structural issues found', 'Validation is advisory; use an authoritative engine before production.');
    issues.forEach(function (item) {
      var container = document.createElement('div'), heading = document.createElement('strong'), detail = document.createElement('small');
      container.className = 'issue ' + item.type;
      heading.textContent = item.title;
      detail.textContent = item.detail;
      container.append(heading, document.createElement('br'), detail);
      issueBox.append(container);
    });
    setStatus(issues.filter(function (item) { return item.type === 'error'; }).length + ' error(s), ' + issues.filter(function (item) { return item.type === 'warn'; }).length + ' warning(s)');
  }

  function downloadFile(name, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type:type || 'text/plain' }));
    var anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = name;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function safeFileName(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'untitled_rule';
  }

  function renderMatches(items, note) {
    var resultBox = byId('results');
    resultBox.replaceChildren();
    items.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'match' + (item.matched ? ' good' : '');
      row.textContent = item.name + ': ' + (item.matched ? 'matched' : 'not matched');
      resultBox.append(row);
    });
    var paragraph = document.createElement('p');
    paragraph.className = 'muted';
    paragraph.textContent = note;
    resultBox.append(paragraph);
  }

  function parseJsonSample() {
    try {
      var parsed = JSON.parse(byId('sample').value);
      return { events:Array.isArray(parsed) ? parsed : [parsed] };
    } catch (error) { return { error:'Sample is not valid JSON.' }; }
  }

  function getPath(object, path) {
    var parts = path.split('.'), value = object;
    for (var i = 0; i < parts.length; i += 1) {
      if (!value || !Object.prototype.hasOwnProperty.call(value, parts[i])) return undefined;
      value = value[parts[i]];
    }
    return value;
  }

  function runTest() {
    saveEditor();
    var rule = currentRule(), sample = byId('sample').value, data, matches = [], comparisons = [], match;
    if (!sample) { byId('results').textContent = 'Add sample data first.'; return; }

    if (rule.language === 'yara') {
      var textPattern = /\$(\w+)\s*=\s*"((?:\\.|[^"\\])*)"([^\r\n]*)/g;
      while ((match = textPattern.exec(rule.source)) !== null) {
        var value;
        try { value = JSON.parse('"' + match[2] + '"'); } catch (error) { value = match[2]; }
        var matched = match[3].indexOf('nocase') >= 0 ? sample.toLowerCase().indexOf(value.toLowerCase()) >= 0 : sample.indexOf(value) >= 0;
        matches.push({ name:'$' + match[1], matched:matched });
      }
      renderMatches(matches, 'Local YARA testing covers common text strings. Use an authoritative YARA engine for complete evaluation.');
      return;
    }

    data = parseJsonSample();
    if (data.error) { byId('results').textContent = data.error; return; }

    if (rule.language === 'yaral') {
      var yaraLPattern = /\$\w+\.([\w.]+)\s*(=|!=)\s*"([^"]*)"/g;
      while ((match = yaraLPattern.exec(rule.source)) !== null) comparisons.push({ path:match[1], operator:match[2], value:match[3] });
      data.events.forEach(function (event, index) {
        var allMatched = comparisons.length > 0 && comparisons.every(function (item) {
          var actual = String(getPath(event, item.path));
          return item.operator === '=' ? actual === item.value : actual !== item.value;
        });
        matches.push({ name:'Event ' + (index + 1), matched:allMatched });
      });
      renderMatches(matches, 'Local YARA-L testing covers simple UDM equality filters, not correlation or outcomes.');
      return;
    }

    var sigmaPattern = /^\s{8}([^:|]+)(?:\|([^:]+))?:\s*['"]?([^'"\r\n]+)['"]?\s*$/gm;
    while ((match = sigmaPattern.exec(rule.source)) !== null) comparisons.push({ field:match[1].trim(), modifiers:(match[2] || '').split('|'), value:match[3].trim() });
    data.events.forEach(function (event, index) {
      var eventMatched = comparisons.length > 0 && comparisons.every(function (item) {
        var actualValue = Object.prototype.hasOwnProperty.call(event, item.field) && event[item.field] != null ? String(event[item.field]) : '';
        if (item.modifiers.indexOf('contains') >= 0) return actualValue.indexOf(item.value) >= 0;
        if (item.modifiers.indexOf('endswith') >= 0) return actualValue.slice(-item.value.length) === item.value;
        if (item.modifiers.indexOf('startswith') >= 0) return actualValue.slice(0, item.value.length) === item.value;
        return actualValue === item.value;
      });
      matches.push({ name:'Event ' + (index + 1), matched:eventMatched });
    });
    renderMatches(matches, 'Local Sigma testing supports simple scalar exact, contains, startswith, and endswith comparisons.');
  }

  function renderReferences() {
    var query = byId('referenceSearch').value.toLowerCase(), language = byId('referenceLanguage').value, grid = byId('referenceGrid');
    grid.replaceChildren();
    references.forEach(function (item) {
      if (language !== 'all' && item[0] !== language) return;
      if (item.slice(1).join(' ').toLowerCase().indexOf(query) < 0) return;
      var card = document.createElement('article'), title = document.createElement('h3'), code = document.createElement('code'), description = document.createElement('p');
      card.className = 'referenceCard';
      title.textContent = (item[0] === 'yaral' ? 'YARA-L' : item[0].toUpperCase()) + ' - ' + item[1];
      code.textContent = item[2];
      description.textContent = item[3];
      card.append(title, code, description);
      grid.append(card);
    });
  }

  document.addEventListener('click', function (event) {
    var tab = event.target.closest('[data-view]');
    if (tab) {
      document.querySelectorAll('.tab').forEach(function (item) { item.setAttribute('aria-selected', String(item === tab)); });
      document.querySelectorAll('.view').forEach(function (item) { item.classList.remove('active'); });
      byId(tab.getAttribute('data-view')).classList.add('active');
    }
    var ruleButton = event.target.closest('[data-rule-id]');
    if (ruleButton) { saveEditor(); activeId = ruleButton.getAttribute('data-rule-id'); loadRule(); }
  });

  byId('editor').addEventListener('input', function () { saveEditor(); window.clearTimeout(validationTimer); validationTimer = window.setTimeout(validateRule, 400); });
  byId('language').addEventListener('change', function () { currentRule().language = byId('language').value; validateRule(); });
  byId('validateButton').addEventListener('click', validateRule);
  byId('newButton').addEventListener('click', function () { addRule(byId('language').value); });
  byId('duplicateButton').addEventListener('click', function () {
    var rule = currentRule(), source = rule.source;
    if (rule.language === 'sigma') {
      source = source.replace(/^title:\s*(.+)$/m, 'title: $1 Copy');
      source = source.split('\n').filter(function (line) { return line.indexOf('id:') !== 0; }).join('\n');
    } else source = source.replace(/(\brule\s+)([A-Za-z_]\w*)/, '$1$2_Copy');
    addRule(rule.language, source);
  });
  byId('deleteButton').addEventListener('click', function () {
    if (rules.length === 1) { setStatus('At least one rule is required'); return; }
    rules = rules.filter(function (rule) { return rule.id !== activeId; });
    activeId = rules[0].id;
    loadRule();
  });
  byId('exportButton').addEventListener('click', function () {
    saveEditor();
    var rule = currentRule(), extension = rule.language === 'yara' ? '.yar' : rule.language === 'yaral' ? '.yaral' : '.yml';
    downloadFile(safeFileName(rule.name) + extension, rule.source);
  });
  byId('exportGroupButton').addEventListener('click', function () {
    saveEditor();
    downloadFile('detection-rule-workbench-group.json', JSON.stringify({ format:'detection-rule-workbench-group', version:3, rules:rules.map(function (rule) { return { language:rule.language, name:rule.name, source:rule.source }; }) }, null, 2), 'application/json');
  });
  byId('fileInput').addEventListener('change', function (event) {
    Array.prototype.forEach.call(event.target.files, function (file) {
      if (file.size > MAX_FILE_SIZE) { setStatus('Skipped oversized file: ' + file.name); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var source = String(reader.result), language = /\.ya?ml$/i.test(file.name) || /^title:/m.test(source) ? 'sigma' : /\bevents\s*:/.test(source) ? 'yaral' : 'yara';
        if (/\.json$/i.test(file.name)) {
          try {
            var group = JSON.parse(source);
            if (Array.isArray(group.rules)) {
              group.rules.slice(0, MAX_RULES - rules.length).forEach(function (item) {
                var itemLanguage = item.language || item.lang;
                if (['yara','yaral','sigma'].indexOf(itemLanguage) >= 0 && typeof item.source === 'string') addRule(itemLanguage, item.source);
              });
              return;
            }
          } catch (error) { /* Treat invalid group JSON as ordinary imported content. */ }
        }
        addRule(language, source);
      };
      reader.readAsText(file);
    });
    event.target.value = '';
  });
  byId('formatButton').addEventListener('click', function () {
    byId('editor').value = byId('editor').value.replace(/\r\n?/g, '\n').replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n').trim() + '\n';
    validateRule();
  });
  byId('runButton').addEventListener('click', runTest);
  byId('clearButton').addEventListener('click', function () { byId('sample').value = ''; byId('results').textContent = 'Sample cleared.'; });
  byId('referenceSearch').addEventListener('input', renderReferences);
  byId('referenceLanguage').addEventListener('change', renderReferences);

  renderReferences();
  loadRule();
}());
</script>
</body>
</html>
